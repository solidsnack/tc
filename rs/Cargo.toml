[package]
name = "timecode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "TimeCodes: sortable, short timestamps"
license = "Unlicense"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "timecode"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
time = "0.3.55"

[dev-dependencies]
proptest = "1.11.0"
time = { version = "0.3.55", features = ["parsing"] }
yaml-rust2 = "0.13.0"
